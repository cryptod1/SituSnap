# Candidate-only build. This branch does not deploy GitHub Pages.
name: Build SituSnap signed release candidate

on:
  push:
    branches:
      - 'release-candidate/**'

jobs:
  build:
    uses: ./.github/workflows/situsnap-android-build.yml
    with:
      artifact_name: SituSnap-Android-Candidate
      candidate: true
    secrets:
      SITUSNAP_CANDIDATE_KEYSTORE_BASE64: ${{ secrets.SITUSNAP_CANDIDATE_KEYSTORE_BASE64 }}
      SITUSNAP_CANDIDATE_KEYSTORE_PASSWORD: ${{ secrets.SITUSNAP_CANDIDATE_KEYSTORE_PASSWORD }}
      SITUSNAP_CANDIDATE_KEY_ALIAS: ${{ secrets.SITUSNAP_CANDIDATE_KEY_ALIAS }}
      SITUSNAP_CANDIDATE_KEY_PASSWORD: ${{ secrets.SITUSNAP_CANDIDATE_KEY_PASSWORD }}
      SITUSNAP_CANDIDATE_CERT_SHA256: ${{ secrets.SITUSNAP_CANDIDATE_CERT_SHA256 }}
