name: Build signed SituSnap Android packages

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name for the APK and AAB build artifact
        required: true
        type: string
    secrets:
      SITUSNAP_KEYSTORE_BASE64:
        required: true
      SITUSNAP_KEYSTORE_PASSWORD:
        required: true
      SITUSNAP_KEY_ALIAS:
        required: true
      SITUSNAP_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure release tags point to main and match the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          source release.properties
          test "${GITHUB_REF_NAME#v}" = "$versionName"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: python3 .github/scripts/make_android.py

      # Candidate-only patch for the Back warning. Keep dropdown UX from the base branch.
      - name: Add isolated Android Back-button confirmation
        run: python3 .github/scripts/patch_back_confirmation.py

      - name: Apply release version and Android API level
        shell: bash
        run: |
          set -euo pipefail
          source release.properties
          sed -i "s/version '8.7.3'/version '8.13.2'/" build.gradle
          sed -i "s/compileSdk 35/compileSdk 36/; s/targetSdk 35/targetSdk 36/; s/versionCode 17/versionCode ${versionCode}/; s/versionName '1.1.1'/versionName '${versionName}'/" app/build.gradle
          grep -q "version '8.13.2'" build.gradle
          grep -q "compileSdk 36" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          grep -q "versionCode ${versionCode}" app/build.gradle
          grep -q "versionName '${versionName}'" app/build.gradle
          grep -Fq "const SS_APP_VERSION=\"${versionName}\"" index.html
          grep -Fq "data-build=\"SituSnap-${versionName}\"" index.html

      - name: Use the same front page and approved logo as situsnap.app
        run: |
          cp index.html app/src/main/assets/phoenix.html
          cp situsnap-brand-mark.png app/src/main/assets/situsnap-brand-mark.png

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SITUSNAP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > situsnap-release.jks
          echo "Keystore size: $(wc -c < situsnap-release.jks) bytes"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed APK and Play Store AAB
        env:
          SITUSNAP_STORE_PASSWORD: ${{ secrets.SITUSNAP_KEYSTORE_PASSWORD }}
          SITUSNAP_KEY_ALIAS: ${{ secrets.SITUSNAP_KEY_ALIAS }}
          SITUSNAP_KEY_PASSWORD: ${{ secrets.SITUSNAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease

      - name: Locate Android build tools
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

      - name: Verify signature, version, package and source parity
        shell: bash
        run: |
          set -euo pipefail
          source release.properties
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          CERT_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")
          echo "$CERT_OUTPUT"
          echo "$CERT_OUTPUT" | grep -qi "certificate SHA-256 digest: eae5c5e8260276a79bc89151617085f6d3d5cf2ba9efa244e60d1de908a2efa2"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='com.situsnap.app.candidate' versionCode='${versionCode}' versionName='${versionName}'"
          echo "$BADGING" | grep -q "sdkVersion:'26'"
          echo "$BADGING" | grep -q "targetSdkVersion:'36'"
          echo "$BADGING" | grep -q "launchable-activity: name='com.situsnap.app.SplashActivity'"

          MANIFEST=$( "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml )
          echo "$MANIFEST"
          echo "$MANIFEST" | grep -Eq 'android:allowBackup.*0x0'
          echo "$MANIFEST" | grep -Fq 'android:dataExtractionRules'
          echo "$MANIFEST" | grep -Fq 'android:fullBackupContent'

          python3 - <<'PY'
          import hashlib
          import os
          import sys
          import zipfile
          from pathlib import Path

          source = Path("index.html").read_bytes()
          staged = Path("app/src/main/assets/phoenix.html").read_bytes()
          apk = Path("app/build/outputs/apk/release/app-release.apk")
          aab = Path("app/build/outputs/bundle/release/app-release.aab")
          expected = hashlib.sha256(source).hexdigest()
          if staged != source:
              sys.exit("FAIL: staged app HTML differs from website index.html")
          with zipfile.ZipFile(apk) as archive:
              try:
                  packaged = archive.read("assets/phoenix.html")
              except KeyError:
                  sys.exit("FAIL: APK is missing assets/phoenix.html")
          if packaged != source:
              sys.exit("FAIL: APK HTML differs from website index.html")
          with zipfile.ZipFile(aab) as archive:
              try:
                  packaged = archive.read("base/assets/phoenix.html")
              except KeyError:
                  sys.exit("FAIL: AAB is missing base/assets/phoenix.html")
          if packaged != source:
              sys.exit("FAIL: AAB HTML differs from website index.html")
          commit = os.environ.get("GITHUB_SHA", "unknown")
          print(f"Website, APK and AAB HTML SHA-256: {expected}")
          print(f"Source commit: {commit}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## SituSnap release consistency\n\n")
              summary.write(f"- Source commit: {commit}\n")
              summary.write(f"- Website, APK and AAB HTML SHA-256: {expected}\n")
          PY
          echo "SIGNED APK AND AAB VERIFIED"
          echo "PACKAGE, VERSION, SDK, LAUNCHER AND HTML VERIFIED"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
