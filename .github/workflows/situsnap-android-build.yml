name: Build signed SituSnap Android packages

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name for the APK and AAB build artifact
        required: true
        type: string
      candidate:
        description: Apply candidate-only package, photo and Back-button patches
        required: false
        default: false
        type: boolean
    secrets:
      SITUSNAP_KEYSTORE_BASE64:
        required: false
      SITUSNAP_KEYSTORE_PASSWORD:
        required: false
      SITUSNAP_KEY_ALIAS:
        required: false
      SITUSNAP_KEY_PASSWORD:
        required: false
      SITUSNAP_CANDIDATE_KEYSTORE_BASE64:
        required: false
      SITUSNAP_CANDIDATE_KEYSTORE_PASSWORD:
        required: false
      SITUSNAP_CANDIDATE_KEY_ALIAS:
        required: false
      SITUSNAP_CANDIDATE_KEY_PASSWORD:
        required: false
      SITUSNAP_CANDIDATE_CERT_SHA256:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject candidate mode on production release tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.candidate }}
        shell: bash
        run: |
          echo "FAIL: candidate-only build mode is forbidden for production release tags." >&2
          exit 1

      - name: Validate production signing credentials
        if: ${{ !inputs.candidate }}
        shell: bash
        env:
          PROD_KEYSTORE: ${{ secrets.SITUSNAP_KEYSTORE_BASE64 }}
          PROD_STORE_PASSWORD: ${{ secrets.SITUSNAP_KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.SITUSNAP_KEY_ALIAS }}
          PROD_KEY_PASSWORD: ${{ secrets.SITUSNAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PROD_KEYSTORE" && test -n "$PROD_STORE_PASSWORD" && test -n "$PROD_KEY_ALIAS" && test -n "$PROD_KEY_PASSWORD"

      - name: Ensure release tags point to main and match the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          source release.properties
          test "${GITHUB_REF_NAME#v}" = "$versionName"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: python3 .github/scripts/make_android.py

      - name: Isolate candidate package identity
        if: inputs.candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app/build.gradle")
          source = gradle.read_text(encoding="utf-8")
          old = "applicationId 'com.situsnap.app'"
          new = "applicationId 'com.situsnap.app.candidate127'"
          if source.count(old) != 1:
              raise SystemExit("FAIL: expected exactly one base applicationId; refusing to patch")
          gradle.write_text(source.replace(old, new, 1), encoding="utf-8")
          manifest = Path("app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          old_label = 'android:label="SituSnap"'
          new_label = 'android:label="SituSnap Test"'
          if source.count(old_label) != 1:
              raise SystemExit("FAIL: expected exactly one app label; refusing to patch")
          manifest.write_text(source.replace(old_label, new_label, 1), encoding="utf-8")
          if "applicationId 'com.situsnap.app.candidate127'" not in gradle.read_text(encoding="utf-8"):
              raise SystemExit("FAIL: candidate applicationId not applied")
          if 'android:label="SituSnap Test"' not in manifest.read_text(encoding="utf-8"):
              raise SystemExit("FAIL: candidate label not applied")
          print("PASS: candidate uses isolated package com.situsnap.app.candidate127 and label SituSnap Test")
          PY

      # Candidate-only changes. The input defaults false so production tag builds do not apply them.
      - name: Patch native camera to app-private temporary storage
        if: inputs.candidate
        run: python3 .github/scripts/patch_native_photo_storage.py

      - name: Add isolated Android Back-button confirmation
        if: inputs.candidate
        run: |
          python3 .github/scripts/patch_back_confirmation.py
          python3 .github/scripts/patch_native_back_dialog.py

      - name: Apply release version and Android API level
        shell: bash
        run: |
          set -euo pipefail
          source release.properties
          sed -i "s/version '8.7.3'/version '8.13.2'/" build.gradle
          sed -i "s/compileSdk 35/compileSdk 36/; s/targetSdk 35/targetSdk 36/; s/versionCode 17/versionCode ${versionCode}/; s/versionName '1.1.1'/versionName '${versionName}'/" app/build.gradle
          grep -q "version '8.13.2'" build.gradle
          grep -q "compileSdk 36" app/build.gradle
          grep -q "targetSdk 36" app/build.gradle
          grep -q "versionCode ${versionCode}" app/build.gradle
          grep -q "versionName '${versionName}'" app/build.gradle
          grep -Fq "const SS_APP_VERSION=\"${versionName}\"" index.html
          grep -Fq "data-build=\"SituSnap-${versionName}\"" index.html

      - name: Use the same front page and approved logo as situsnap.app
        run: |
          cp index.html app/src/main/assets/phoenix.html
          cp situsnap-brand-mark.png app/src/main/assets/situsnap-brand-mark.png

      - name: Restore production signing key
        if: ${{ !inputs.candidate }}
        env:
          KEYSTORE_BASE64: ${{ secrets.SITUSNAP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > situsnap-release.jks
          echo "Production keystore restored."

      - name: Generate one-time candidate signing key
        if: inputs.candidate
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS="situsnap-candidate-ephemeral"
          keytool -genkeypair -noprompt -v -storetype JKS -keystore situsnap-release.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SituSnap Test, OU=Development, O=SituSnap, L=Cardiff, ST=Wales, C=GB" -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD"
          CERT_SHA256="$(keytool -list -v -keystore situsnap-release.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | awk '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}')"
          test -n "$CERT_SHA256"
          echo "CANDIDATE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CANDIDATE_KEY_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CANDIDATE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CANDIDATE_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          echo "SITUSNAP_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SITUSNAP_KEY_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SITUSNAP_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "Created one-time signing key for isolated candidate test build."

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build candidate APK and AAB
        if: inputs.candidate
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease

      - name: Build production APK and Play Store AAB
        if: ${{ !inputs.candidate }}
        env:
          SITUSNAP_STORE_PASSWORD: ${{ secrets.SITUSNAP_KEYSTORE_PASSWORD }}
          SITUSNAP_KEY_ALIAS: ${{ secrets.SITUSNAP_KEY_ALIAS }}
          SITUSNAP_KEY_PASSWORD: ${{ secrets.SITUSNAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease

      - name: Locate Android build tools
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

      - name: Verify signature, version, package and source parity
        shell: bash
        run: |
          set -euo pipefail
          source release.properties
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          CERT_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")
          echo "$CERT_OUTPUT"
          if [ "${{ inputs.candidate }}" = "true" ]; then
            echo "$CERT_OUTPUT" | grep -qi "certificate SHA-256 digest: $CANDIDATE_CERT_SHA256"
          else
            echo "$CERT_OUTPUT" | grep -qi "certificate SHA-256 digest: eae5c5e8260276a79bc89151617085f6d3d5cf2ba9efa244e60d1de908a2efa2"
          fi
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          if [ "${{ inputs.candidate }}" = "true" ]; then
            echo "$BADGING" | grep -q "package: name='com.situsnap.app.candidate127' versionCode='${versionCode}' versionName='${versionName}'"
          else
            echo "$BADGING" | grep -q "package: name='com.situsnap.app' versionCode='${versionCode}' versionName='${versionName}'"
          fi
          echo "$BADGING" | grep -q "sdkVersion:'26'"
          echo "$BADGING" | grep -q "targetSdkVersion:'36'"
          echo "$BADGING" | grep -q "launchable-activity: name='com.situsnap.app.SplashActivity'"

          MANIFEST=$( "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml )
          echo "$MANIFEST"
          echo "$MANIFEST" | grep -Eq 'android:allowBackup.*0x0'
          echo "$MANIFEST" | grep -Fq 'android:dataExtractionRules'
          echo "$MANIFEST" | grep -Fq 'android:fullBackupContent'

          python3 - <<'PY'
          import hashlib
          import os
          import sys
          import zipfile
          from pathlib import Path

          source = Path("index.html").read_bytes()
          staged = Path("app/src/main/assets/phoenix.html").read_bytes()
          apk = Path("app/build/outputs/apk/release/app-release.apk")
          aab = Path("app/build/outputs/bundle/release/app-release.aab")
          expected = hashlib.sha256(source).hexdigest()
          if staged != source:
              sys.exit("FAIL: staged app HTML differs from website index.html")
          with zipfile.ZipFile(apk) as archive:
              try:
                  packaged = archive.read("assets/phoenix.html")
              except KeyError:
                  sys.exit("FAIL: APK is missing assets/phoenix.html")
          if packaged != source:
              sys.exit("FAIL: APK HTML differs from website index.html")
          with zipfile.ZipFile(aab) as archive:
              try:
                  packaged = archive.read("base/assets/phoenix.html")
              except KeyError:
                  sys.exit("FAIL: AAB is missing base/assets/phoenix.html")
          if packaged != source:
              sys.exit("FAIL: AAB HTML differs from website index.html")
          commit = os.environ.get("GITHUB_SHA", "unknown")
          print(f"Website, APK and AAB HTML SHA-256: {expected}")
          print(f"Source commit: {commit}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## SituSnap release consistency\n\n")
              summary.write(f"- Source commit: {commit}\n")
              summary.write(f"- Website, APK and AAB HTML SHA-256: {expected}\n")
          PY
          echo "SIGNED APK AND AAB VERIFIED"
          echo "PACKAGE, VERSION, SDK, LAUNCHER AND HTML VERIFIED"

      - name: Verify private camera implementation is packaged
        if: inputs.candidate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          MANIFEST=$("$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml)
          echo "$MANIFEST" | grep -Fq 'androidx.core.content.FileProvider'
          echo "$MANIFEST" | grep -Fq 'com.situsnap.app.candidate127.photos'
          RESOURCES=$("$BUILD_TOOLS/aapt" dump resources "$APK")
          echo "$RESOURCES" | grep -Fq 'xml/situsnap_photo_paths'
          python3 - <<'PY'
          import sys, zipfile
          apk = "app/build/outputs/apk/release/app-release.apk"
          with zipfile.ZipFile(apk) as archive:
              dex_names = [n for n in archive.namelist() if n.endswith('.dex')]
              if not dex_names:
                  sys.exit('FAIL: no DEX bytecode found')
              dex = b''.join(archive.read(n) for n in dex_names)
          for marker in (b'androidx/core/content/FileProvider', b'situsnap-camera'):
              if marker not in dex:
                  sys.exit('FAIL: private camera marker missing: ' + marker.decode())
          if b'MediaStore$Images$Media' in dex:
              sys.exit('FAIL: legacy shared-gallery MediaStore API remains in DEX')
          print('PASS: private FileProvider/cache markers are packaged; legacy gallery insert marker absent')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
