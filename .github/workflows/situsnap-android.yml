name: Build SituSnap Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: python3 .github/scripts/make_android.py

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SITUSNAP_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > situsnap-release.jks
          echo "✅ Keystore restored"
          echo "Keystore size: $(wc -c < situsnap-release.jks) bytes"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build permanently signed APK
        env:
          SITUSNAP_STORE_PASSWORD: ${{ secrets.SITUSNAP_KEYSTORE_PASSWORD }}
          SITUSNAP_KEY_ALIAS: ${{ secrets.SITUSNAP_KEY_ALIAS }}
          SITUSNAP_KEY_PASSWORD: ${{ secrets.SITUSNAP_KEY_PASSWORD }}
        run: |
          set -e
          gradle assembleRelease

      - name: Verify APK exists and is signed
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ Release APK not found"
            exit 1
          fi

          echo "APK size: $(wc -c < "$APK") bytes"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "❌ apksigner not found"
            exit 1
          fi

          echo "Using: $APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "🔥 SIGNED APK VERIFIED"

      - uses: actions/upload-artifact@v4
        with:
          name: SituSnap-Android-V1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
