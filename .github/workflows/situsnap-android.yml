name: Build SituSnap Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: python3 .github/scripts/make_android.py

      - name: Use the same front page and approved logo as situsnap.app
        run: |
          cp index.html app/src/main/assets/phoenix.html
          cp situsnap-brand-mark.png app/src/main/assets/situsnap-brand-mark.png

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SITUSNAP_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > situsnap-release.jks
          echo "✅ Keystore restored"
          echo "Keystore size: $(wc -c < situsnap-release.jks) bytes"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build permanently signed APK
        env:
          SITUSNAP_STORE_PASSWORD: ${{ secrets.SITUSNAP_KEYSTORE_PASSWORD }}
          SITUSNAP_KEY_ALIAS: ${{ secrets.SITUSNAP_KEY_ALIAS }}
          SITUSNAP_KEY_PASSWORD: ${{ secrets.SITUSNAP_KEY_PASSWORD }}
        run: |
          set -e
          gradle assembleRelease

      - name: Locate Android build tools
        run: |
          set -e
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

      - name: Verify APK signature
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "🔥 SIGNED APK VERIFIED"

      - name: Final SituSnap package gate
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='com.situsnap.app'"
          echo "$BADGING" | grep -q "sdkVersion:'26'"
          echo "$BADGING" | grep -q "targetSdkVersion:'35'"
          echo "$BADGING" | grep -q "launchable-activity: name='com.situsnap.app.SplashActivity'"
          python3 - <<'PY'
          import hashlib
          import os
          import sys
          import zipfile
          from pathlib import Path

          source = Path("index.html").read_bytes()
          staged = Path("app/src/main/assets/phoenix.html").read_bytes()
          apk = Path("app/build/outputs/apk/release/app-release.apk")
          expected = hashlib.sha256(source).hexdigest()
          if staged != source:
              sys.exit("FAIL: staged app HTML differs from the website index.html")
          with zipfile.ZipFile(apk) as archive:
              try:
                  packaged = archive.read("assets/phoenix.html")
              except KeyError:
                  sys.exit("FAIL: APK is missing assets/phoenix.html")
          if packaged != source:
              sys.exit("FAIL: APK HTML differs from website index.html")
          commit = os.environ.get("GITHUB_SHA", "unknown")
          print(f"Website and APK HTML SHA-256: {expected}")
          print(f"Source commit: {commit}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## SituSnap release consistency\n\n")
              summary.write(f"- Source commit: {commit}\n")
              summary.write(f"- Website and APK HTML SHA-256: {expected}\n")
          PY
          echo "🔥 PACKAGE ID VERIFIED"
          echo "🔥 SDK VERIFIED"
          echo "🔥 SPLASH LAUNCHER VERIFIED"
          echo "🔥 WEBSITE AND APK HTML MATCH"
          echo "🔥 SITUSNAP APK PASSED ALL BUILD GATES"

      - uses: actions/upload-artifact@v4
        with:
          name: SituSnap-Android-V1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
