name: Build SituSnap Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: python3 .github/scripts/make_android.py

      - name: Apply SituSnap branding
        run: python3 .github/scripts/apply_situsnap_branding.py

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SITUSNAP_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > situsnap-release.jks
          echo "✅ Keystore restored"
          echo "Keystore size: $(wc -c < situsnap-release.jks) bytes"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build permanently signed APK
        env:
          SITUSNAP_STORE_PASSWORD: ${{ secrets.SITUSNAP_KEYSTORE_PASSWORD }}
          SITUSNAP_KEY_ALIAS: ${{ secrets.SITUSNAP_KEY_ALIAS }}
          SITUSNAP_KEY_PASSWORD: ${{ secrets.SITUSNAP_KEY_PASSWORD }}
        run: |
          set -e
          gradle assembleRelease

      - name: Locate Android build tools
        run: |
          set -e
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

      - name: Verify APK signature
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "🔥 SIGNED APK VERIFIED"

      - name: Final SituSnap package gate
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='com.situsnap.app.release'"
          echo "$BADGING" | grep -q "sdkVersion:'26'"
          echo "$BADGING" | grep -q "targetSdkVersion:'35'"
          echo "$BADGING" | grep -q "launchable-activity: name='com.situsnap.app.SplashActivity'"
          echo "$BADGING" | grep -q "application-icon"
          echo "🔥 PACKAGE ID VERIFIED"
          echo "🔥 SDK VERIFIED"
          echo "🔥 BRANDED LAUNCHER VERIFIED"
          echo "🔥 SITUSNAP APK PASSED ALL BUILD GATES"

      - uses: actions/upload-artifact@v4
        with:
          name: SituSnap-Android-V1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
