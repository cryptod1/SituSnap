name: Build SituSnap Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android project
        run: python3 .github/scripts/make_android.py
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SITUSNAP_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > situsnap-release.jks
          echo ✅ Keystore restored
          echo "Keystore size: $(wc -c < situsnap-release.jks) bytes"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build permanently signed APK
        env:
          SITUSNAP_STORE_PASSWORD: ${{ secrets.SITUSNAP_KEYSTORE_PASSWORD }}
          SITUSNAP_KEY_ALIAS: ${{ secrets.SITUSNAP_KEY_ALIAS }}
          SITUSNAP_KEY_PASSWORD: ${{ secrets.SITUSNAP_KEY_PASSWORD }}
        run: |
          set -e
          gradle assembleRelease
      - name: Locate Android build tools
        run: |
          set -e
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
      - name: Verify APK signature
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "🔥 SIGNED APK VERIFIED"
      - name: Final SituSnap package gate
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='com.situsnap.app'"
          echo "$BADGING" | grep -q "sdkVersion:'26'"
          echo "$BADGING" | grep -q "targetSdkVersion:'35'"
          echo "$BADGING" | grep -q "launchable-activity: name='com.situsnap.app.SplashActivity'"
          echo "🔥 PACKAGE ID VERIFIED"
          echo "🔥 SDK VERIFIED"
          echo "🔥 SPLASH LAUNCHER VERIFIED"
          echo "🔥 SITUSNAP APK PASSED ALL BUILD GATES"
      - uses: actions/upload-artifact@v4
        with:
          name: SituSnap-Android-V1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  mirror:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept only Android platform and build-tools licenses and install packages
        shell: bash
        run: |
          set -eu
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack mirror source
        
        run: unzip -q situsnap-android-mirror-source.zip -d .
      - name: Align mirror Java and Kotlin targets
        working-directory: android-mirror
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          source = path.read_text()
          source = source.replace("geolocationEnabled = true", "setGeolocationEnabled(true)")
          marker = "    defaultConfig {"
          addition = "    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n    kotlinOptions {\n        jvmTarget = \"17\"\n    }\n\n"
          if "jvmTarget = \"17\"" not in source:
              if marker not in source:
                  raise SystemExit("Could not find defaultConfig block to align compiler targets")
              path.write_text(source.replace(marker, addition + marker, 1))
          path.write_text(source)
          PY

      - name: Build mirror APK
        working-directory: android-mirror
        run: gradle --no-daemon assembleDebug
      - name: Verify mirror package ID
        run: |
          set -euo pipefail
          BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0
          "$BUILD_TOOLS/aapt" dump badging android-mirror/app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='uk.co.situsnap.mirror'"
      - uses: actions/upload-artifact@v4
        with:
          name: SituSnap-Mirror-1.1.1-debug
          path: android-mirror/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
