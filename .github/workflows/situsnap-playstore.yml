name: Build SituSnap Play test bundle

on:
  push:
    branches:
      - product/playstore-clean-site
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-test:
    if: github.ref == 'refs/heads/product/playstore-clean-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check runner Android 16 SDK
        run: |
          set -euo pipefail
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Generate Android wrapper and stage independent app source
        run: |
          set -euo pipefail
          test -s app-source/situsnap-app.html
          python3 .github/scripts/make_android.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/situsnap/app/MainActivity.java")
          source = path.read_text()
          base = '"https://cryptod1.github.io/SituSnap/",\n                phoenix'
          replacement = '"https://situsnap.app/",\n                phoenix'
          if source.count(base) != 1:
              raise SystemExit("Expected exactly one generated WebView base origin")
          source = source.replace(base, replacement, 1)
          old_allow = 'if (url.startsWith("https://cryptod1.github.io/SituSnap/")'
          new_allow = 'if (url.startsWith("https://cryptod1.github.io/SituSnap/")\n                    || url.startsWith("https://situsnap.app/")'
          if source.count(old_allow) != 1:
              raise SystemExit("Expected exactly one generated internal navigation allowlist")
          source = source.replace(old_allow, new_allow, 1)
          path.write_text(source)
          print("APK WebView base origin set to https://situsnap.app for Breadcrumbs CORS")
          PY
          cp app-source/situsnap-app.html app/src/main/assets/phoenix.html
          cp situsnap-brand-mark.png app/src/main/assets/situsnap-brand-mark.png

      - name: Set Play target SDK to API 36
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          changed_compile = 0
          changed_target = 0
          changed_version_code = 0
          changed_version_name = 0
          for path in list(Path("app").rglob("*.gradle")) + list(Path("app").rglob("*.gradle.kts")):
              content = path.read_text()
              updated, count = re.subn(r"(\bcompileSdk(?:Version)?\s*(?:=\s*)?)35\b", r"\g<1>36", content)
              changed_compile += count
              content = updated
              updated, count = re.subn(r"(\btargetSdk(?:Version)?\s*(?:=\s*)?)35\b", r"\g<1>36", content)
              changed_target += count
              updated, count = re.subn(r"(\bversionCode\s+)17\b", r"\g<1>22", updated)
              changed_version_code += count
              updated, count = re.subn(r"(\bversionName\s+)[\"'][^\"']+[\"']", r'\g<1>"1.2.4"', updated)
              changed_version_name += count
              if updated != path.read_text():
                  path.write_text(updated)
          if not changed_compile or not changed_target or not changed_version_code or not changed_version_name:
              raise SystemExit(f"Build metadata missing (compile={changed_compile}, target={changed_target}, versionCode={changed_version_code}, versionName={changed_version_name})")
          print(f"API 36 set; versionCode=22/versionName=1.2.4")
          PY

      - name: Restore existing SituSnap release key
        env:
          KEYSTORE_BASE64: ${{ secrets.SITUSNAP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > situsnap-release.jks
          test -s situsnap-release.jks

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK and Play AAB
        env:
          SITUSNAP_STORE_PASSWORD: ${{ secrets.SITUSNAP_KEYSTORE_PASSWORD }}
          SITUSNAP_KEY_ALIAS: ${{ secrets.SITUSNAP_KEY_ALIAS }}
          SITUSNAP_KEY_PASSWORD: ${{ secrets.SITUSNAP_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease

      - name: Verify package, SDK level, signing and separate app source
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$APK"
          test -f "$AAB"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/situsnap-badging.txt
          grep -q "package: name='com.situsnap.app'" /tmp/situsnap-badging.txt
          grep -q "sdkVersion:'26'" /tmp/situsnap-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/situsnap-badging.txt
          grep -q "launchable-activity: name='com.situsnap.app.SplashActivity'" /tmp/situsnap-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          source = Path("app-source/situsnap-app.html").read_bytes()
          apk_path = Path("app/build/outputs/apk/release/app-release.apk")
          with zipfile.ZipFile(apk_path) as apk:
              packaged = apk.read("assets/phoenix.html")
          if source != packaged:
              raise SystemExit("APK does not contain the dedicated app source")
          with zipfile.ZipFile("app/build/outputs/bundle/release/app-release.aab") as aab:
              names = aab.namelist()
              if not any(name.endswith("/assets/phoenix.html") for name in names):
                  raise SystemExit("AAB is missing the packaged app page")
          print("Dedicated app source SHA-256:", hashlib.sha256(source).hexdigest())
          PY
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          sha256sum "$APK" "$AAB" > app/build/outputs/release-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SituSnap-Play-closed-test-build
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/release-sha256.txt
          if-no-files-found: error
          retention-days: 14
